<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Laborator JavaScript - Funcții, Obiecte, Metode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Laborator JavaScript</h1>

    <section class="joc">
        <h2>Piatra, Hârtia, Foarfeca</h2>

        <div class="butoane">
            <button id="btn-piatra">Piatra</button>
            <button id="btn-hartia">Hârtia</button>
            <button id="btn-foarfeca">Foarfeca</button>
        </div>

        <div class="rezultate">
            <p>Alegerea ta: <span id="alegere-jucator">-</span></p>
            <p>Alegerea calculatorului: <span id="alegere-calculator">-</span></p>
            <p>Rezultat: <span id="rezultat">-</span></p>
        </div>

        <div class="scor">
            <p>Scor:</p>
            <p>Jucător: <span id="scor-jucator">0</span></p>
            <p>Calculator: <span id="scor-calculator">0</span></p>
            <p>Egalități: <span id="scor-egal">0</span></p>
            <p>Runde jucate: <span id="runde">0</span></p>
        </div>

        <button id="btn-reset">Joc nou</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
